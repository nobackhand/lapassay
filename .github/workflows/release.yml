name: Release

# Two ways to cut a release, both producing the same draft GitHub release with
# both self-contained binaries (+ ONNX model) and SHA256SUMS:
#   1. Push a tag `v0.7.0` — the normal path. The tag must match LapassayVersion.Value.
#   2. Run this workflow manually (workflow_dispatch) on a branch — useful when tags
#      can't be pushed directly. The version is read from source and the tag is
#      created by the release step.
#
# No PublishTrimmed: Avalonia, LibreHardwareMonitor, and WMI are reflection-heavy
# and break under trimming. Single-file + self-contained only.

on:
  push:
    tags: ['v*']
    # Touching this sentinel file on main also cuts a (draft) release — the path that
    # works in environments where tags can't be pushed and workflow_dispatch isn't
    # permitted. Write the target version into it and merge.
    branches: [main]
    paths: ['.github/RELEASE_TRIGGER']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $src = Get-Content src/Lapassay.Core/LapassayVersion.cs -Raw
          if ($src -notmatch 'Value\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            Write-Error "Could not read LapassayVersion.Value from source."
          }
          $version = $Matches[1]
          # On a tag push, the tag must match the source version so a release can't
          # ship a binary whose --version disagrees with its tag.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $version) {
              Write-Error "Tag v$tag does not match LapassayVersion.Value ($version) — update the source first."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing v$version"

      - name: Publish CLI
        run: >
          dotnet publish src/Lapassay.Cli/Lapassay.Cli.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/cli

      - name: Publish GUI
        run: >
          dotnet publish src/Lapassay.Gui/Lapassay.Gui.csproj -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/gui

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          New-Item -ItemType Directory dist | Out-Null
          # The ONNX model ships as a loose file beside the exe (models\squeezenet1.0-9.onnx)
          # — zip each publish folder whole so the AI benchmark works out of the box.
          Compress-Archive -Path publish/cli/* -DestinationPath "dist/lapassay-cli-$tag-win-x64.zip"
          Compress-Archive -Path publish/gui/* -DestinationPath "dist/lapassay-gui-$tag-win-x64.zip"
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Lapassay ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: true
